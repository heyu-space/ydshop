<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5fb">
  <meta name="description" content="劫禾数字商店，浏览商品套餐、价格与付款信息。">
  <title>劫禾 · 数字商店</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h12M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5a8.5 8.5 0 1 0 10.6 10.6Z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v9l9 5 9-5V8M12 13v9M7.5 5.5l9 5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </defs></svg>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="menu-button" class="icon-button mobile-only" type="button" aria-label="打开侧边栏" aria-controls="sidebar" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button>
      <a class="brand" href="#products" aria-label="劫禾数字商店首页"><span class="brand-mark">劫</span><span>劫禾<span class="brand-divider"> / </span><small>数字商店</small></span></a>
      <span class="topbar-caption">资源与灵感，随时发现</span>
      <button id="theme-button" class="icon-button theme-button" type="button" aria-label="切换深色模式" aria-pressed="false"><svg class="icon"><use href="#i-moon"/></svg></button>
    </div>
  </header>
  <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="商店导航" tabindex="-1">
      <div class="drawer-title"><span class="brand"><span class="brand-mark">劫</span>劫禾的小店</span><button id="close-sidebar" class="icon-button mobile-only" type="button" aria-label="关闭侧边栏"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <div class="nav-label">发现商品</div>
      <nav class="side-nav">
        <button class="side-link active" data-category="all" type="button"><svg class="icon"><use href="#i-grid"/></svg>全部商品<span>04</span></button>
        <button class="side-link" data-category="package" type="button"><svg class="icon"><use href="#i-box"/></svg>标准套餐<span>03</span></button>
        <button class="side-link" data-category="custom" type="button"><svg class="icon"><use href="#i-spark"/></svg>定制套餐<span>01</span></button>
      </nav>
      <div class="side-separator"></div>
      <div class="nav-label">小店指南</div>
      <nav class="side-nav">
        <button class="side-link" type="button" data-open="pricing"><svg class="icon"><use href="#i-image"/></svg>商品价格图<svg class="icon side-arrow"><use href="#i-arrow"/></svg></button>
        <button class="side-link" type="button" data-open="guide"><svg class="icon"><use href="#i-info"/></svg>购买须知<svg class="icon side-arrow"><use href="#i-arrow"/></svg></button>
      </nav>
      <div class="sidebar-foot"><span class="small-mark">J.</span><span>劫禾 · 数字商店<small>找到适合你的那一款</small></span></div>
    </aside>
    <main id="products">
      <section class="store-heading"><div><h1>挑选你的下一份好物<span class="heading-dot">.</span></h1><p>曲奇制裁盒子 · 套餐专区</p></div><button class="text-button pricing-shortcut" data-open="pricing" type="button">价格图<svg class="icon"><use href="#i-arrow"/></svg></button></section>
      <div class="searchbar"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" autocomplete="off" placeholder="搜索商品、套餐…" aria-label="搜索商品"><span class="search-hint">快速查找</span></div>
      <div class="filterbar"><div class="filters" role="group" aria-label="商品分类"><button type="button" class="filter active" data-category="all" aria-pressed="true">全部商品</button><button type="button" class="filter" data-category="package" aria-pressed="false">标准套餐</button><button type="button" class="filter" data-category="custom" aria-pressed="false">定制</button></div><span id="result-count" aria-live="polite">4 款商品</span></div>
      <section id="product-grid" class="product-grid" aria-label="商品列表"></section>
      <div class="plus-note"><svg class="icon"><use href="#i-spark"/></svg><span>想了解 Plus？<small>价格以店主沟通为准</small></span><button class="text-button" type="button" data-open="plus">查看说明<svg class="icon"><use href="#i-arrow"/></svg></button></div>
      <footer><span>劫禾 · 数字商店</span><button type="button" class="text-button" data-open="guide">扫码付款 · 人工核实</button></footer>
    </main>
  </div>
  <dialog id="checkout" class="checkout-dialog" aria-labelledby="checkout-title">
    <div class="dialog-heading"><div><span class="eyebrow">选好啦，下一步</span><h2 id="checkout-title">确认购买</h2></div><button class="icon-button" type="button" data-close="checkout" aria-label="关闭购买窗口"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div class="checkout-body">
      <div class="checkout-product"><div class="checkout-icon"><svg class="icon"><use href="#i-box"/></svg></div><div><strong id="checkout-product-name"></strong><p>曲奇制裁盒子</p></div><button class="text-button" type="button" data-open="pricing">详情</button></div>
      <div class="quantity-row"><label>购买数量</label><div class="stepper"><button id="minus" type="button" aria-label="减少数量">−</button><output id="quantity" aria-live="polite">1</output><button id="plus" type="button" aria-label="增加数量">+</button></div></div>
      <div class="total-row"><span>应付金额</span><strong><small>¥</small><span id="payment-total">35.00</span></strong></div>
      <div class="payment-tabs" role="group" aria-label="付款方式"><button type="button" class="payment-tab selected" data-method="alipay" aria-pressed="true"><span class="pay-logo alipay-logo">支</span>支付宝</button><button type="button" class="payment-tab" data-method="wechat" aria-pressed="false"><span class="pay-logo wechat-logo">赏</span>微信赞赏</button></div>
      <div class="payment-code-wrap"><div class="code-frame" id="code-frame"><img id="payment-code" src="assets/alipay-payment.jpg" alt="店主提供的支付宝收款码" width="1024" height="1536"></div><p id="pay-method-hint">用支付宝扫描，按上方金额付款</p></div>
      <div class="payment-actions"><a id="download-code" class="primary-button" href="assets/alipay-payment.jpg" download="劫禾-支付宝收款码.jpg"><svg class="icon"><use href="#i-download"/></svg>保存收款码</a><a id="full-code" class="secondary-button" href="assets/alipay-payment.jpg" target="_blank" rel="noopener">查看原图</a></div>
      <p class="payment-note">付款前请先与店主确认交付方式；付款后保留凭证，由店主核实到账并交付。</p>
    </div>
  </dialog>
  <dialog id="pricing-dialog" class="pricing-dialog" aria-labelledby="pricing-title"><div class="dialog-heading"><div><span class="eyebrow">商品说明</span><h2 id="pricing-title">曲奇制裁盒子 · 价格图</h2></div><button class="icon-button" type="button" data-close="pricing-dialog" aria-label="关闭价格图"><svg class="icon"><use href="#i-close"/></svg></button></div><p class="image-tip">点击图片查看原尺寸，方便放大阅读。</p><a class="pricing-image-link" href="assets/product-pricing.jpg" target="_blank" rel="noopener"><img src="assets/product-pricing.jpg" alt="店主提供的曲奇制裁盒子商品价格与套餐说明图" width="1536" height="1298"></a></dialog>
  <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title"><div class="dialog-heading"><h2 id="info-title"></h2><button class="icon-button" type="button" data-close="info-dialog" aria-label="关闭说明"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="info-content" class="info-content"></div><button class="primary-button info-close" type="button" data-close="info-dialog">知道了</button></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
